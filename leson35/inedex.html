<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form onsubmit="return validation();" method="POST">
        <div class="name-container">
            <label for="name" id="name_label">Name: </label>
            <input type="text" name="name" id="name">
            <span id="name_error">Please enter a valid name</span>
        </div>
        <br>

        <div class="age-contanier">
            <label for="name" id="age_label">Age:</label>
            <input type="text" name="age" id="age">
            <span id="age_error">Pleas enter a valid age</span>
        </div>
        <br>

        <div class="city-container">
            <label for="city" id="city_label">City:</label>
            <select name="city" id="city">
                <option value="Prishtine"selected>Prishtine</option>
                <option value="Gjilan"selected>Gjilan</option>
                <option value="Gjakove"selected>Gjakobe</option>
                <option value="Ferizaj"selected>Ferizaj</option>
                <option value="Drenic"selected>Drenic</option>
            </select>

            <span id="city_error">Please select a city</span>
        </div>
        <button type="submit" name="submit">Send</button>
    </form>


    <script src="main.js"></script>
</body>
</html>
